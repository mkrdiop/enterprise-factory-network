name: EFS schema conformance
on:
  push:
  pull_request:
jobs:
  schema-conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check scripts tests
      - run: python -m pytest -q
      - run: python -m pytest tests/test_conformance_catalog.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/conformance/verify_psi50_interop.mjs
      - run: python tests/conformance/verify_psi50_jcs.py
      - run: python scripts/validate_manifest.py fixtures/valid/manifest-minimal.json --json
      - run: python scripts/validate_manifest.py fixtures/valid/manifest-external-execution.json
      - run: python scripts/validate_manifest.py fixtures/boundary/manifest-offset-datetime.json
