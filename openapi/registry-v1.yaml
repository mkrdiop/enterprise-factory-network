openapi: 3.1.0
info:
  title: Enterprise Factory Network Registry API
  version: 1.0.0
  description: >
    Versioned EFS v1 manifest registry API. Publisher identity is the exact
    canonical opaque URI defined by ADR-003. Release versions are opaque.
    This API does not resolve latest-compatible versions or implement publisher
    trust, signatures, policy authorization, or runtime admission.
servers:
  - url: https://registry.example.invalid
    description: Deployment placeholder; replace with the configured registry origin.
tags:
  - name: publications
  - name: factories
  - name: releases
paths:
  /v1/releases:
    post:
      tags: [publications]
      operationId: publishFactoryRelease
      summary: Validate and publish an immutable Factory Release
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Opaque client retry key; same key and same request fingerprint return the same operation.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/efs/v1/factory-manifest.schema.json
      responses:
        '201':
          description: Release committed and durably retrievable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationResult'
        '202':
          description: Durable publication operation is pending; it is not yet a published release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationResult'
        '409':
          description: Idempotency key or immutable Factory/version binding conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationResult'
        '422':
          description: Manifest schema, semantic profile, parser or digest validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [releases]
      operationId: getExactFactoryRelease
      summary: Retrieve one exact Factory Release version
      parameters:
        - $ref: '#/components/parameters/PublisherId'
        - $ref: '#/components/parameters/FactoryId'
        - name: version
          in: query
          required: true
          description: Exact opaque release version; no semantic-version parsing or latest resolution.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Reconstructed manifest projection with the verified digest.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Exact release not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Artifact unavailable or failed integrity verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/factories:
    get:
      tags: [factories]
      operationId: getFactory
      summary: Retrieve a Factory by exact publisher-scoped identity
      parameters:
        - $ref: '#/components/parameters/PublisherId'
        - $ref: '#/components/parameters/FactoryId'
      responses:
        '200':
          description: Factory with at least one committed release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySummary'
        '404':
          description: Factory not found or has no committed releases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/factories/releases:
    get:
      tags: [releases]
      operationId: listFactoryReleases
      summary: List committed releases for one exact Factory identity
      parameters:
        - $ref: '#/components/parameters/PublisherId'
        - $ref: '#/components/parameters/FactoryId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor; clients must not interpret its contents.
          schema:
            type: string
      responses:
        '200':
          description: Deterministically ordered release page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasePage'
        '400':
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Factory not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/publications/{operation_id}:
    get:
      tags: [publications]
      operationId: getPublicationOperation
      summary: Retrieve publication operation status
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Durable publication operation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '404':
          description: Operation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    PublisherId:
      name: publisher_id
      in: query
      required: true
      description: Exact absolute canonical URI under efs-uri-c14n-1; never dereferenced.
      schema:
        type: string
        format: uri
    FactoryId:
      name: factory_id
      in: query
      required: true
      description: Exact case-sensitive Factory ID scoped by publisher_id.
      schema:
        type: string
        minLength: 1
  schemas:
    Digest:
      type: object
      required: [profile, algorithm, value]
      properties:
        profile:
          const: efs-jcs-sha256-v1
        algorithm:
          const: SHA-256
        value:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    PublicationResult:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [committed, pending, conflict]
        operationId:
          type: [string, 'null']
          format: uuid
        releaseRecordId:
          type: [string, 'null']
          format: uuid
        errorCode:
          type: [string, 'null']
    PublicationStatus:
      type: object
      required: [operationId, state]
      properties:
        operationId:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, committed, conflict, failed]
        errorCode:
          type: [string, 'null']
        releaseRecordId:
          type: [string, 'null']
          format: uuid
    FactorySummary:
      type: object
      required: [publisherId, factoryId, releaseCount, lifecycleState]
      properties:
        publisherId:
          type: string
          format: uri
        factoryId:
          type: string
        releaseCount:
          type: integer
          minimum: 1
        lifecycleState:
          type: string
          enum: [active, retired]
    ReleaseRecord:
      type: object
      required: [version, digest, publishedAt]
      properties:
        version:
          type: string
        digest:
          $ref: '#/components/schemas/Digest'
        publishedAt:
          type: string
          format: date-time
    ReleasePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseRecord'
        nextCursor:
          type: [string, 'null']
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            diagnostics:
              type: array
              items:
                type: object
